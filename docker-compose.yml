services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_management_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://gym_user:gym_secret_password@db:5432/gym_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: gym_management_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gym_user
      - POSTGRES_PASSWORD=gym_secret_password
      - POSTGRES_DB=gym_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

